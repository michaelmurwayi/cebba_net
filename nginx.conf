server {

    listen 80;

    server_name _;

    root /usr/share/nginx/html;

    index index.html;

    charset utf-8;

    # Static bundle uploads (XLSX workbooks) exceed nginx's 1 MB default.
    client_max_body_size 32m;

    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;

    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        application/wasm
        image/svg+xml;

    # The SPA entry document must never be cached, otherwise a deploy leaves
    # clients loading a stale index.html pointing at deleted hashed assets.
    # HSTS MUST be repeated here: this location declares add_header, so it
    # inherits nothing from the server block — including Strict-Transport-Security.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # BrowserRouter routes (/sales, /farmers, ...) must fall back to the shell.
    location / {

        try_files $uri $uri/ /index.html;

    }

    # NOTE: add_header does NOT merge across levels. A location that declares
    # its own add_header inherits NOTHING from the server block, so every
    # security header has to be repeated here or assets ship unprotected.
    # `expires` is deliberately absent: it emits its own Cache-Control and
    # would send the header twice alongside the one below.
    location ~* \.(js|mjs|css|png|jpg|jpeg|gif|svg|ico|webp|avif|woff2?|ttf|eot|map)$ {

        expires off;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # A missing asset is a real 404, never the SPA shell.
        try_files $uri =404;

    }

    # Unblock Traefik / Swarm health probes without touching the SPA.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # TLS terminates at Traefik, but this header is passed through to the
    # browser over the public HTTPS connection, which is what counts.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    server_tokens off;
}