worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # ===============================
    # Upstream services (Docker Swarm)
    # ===============================

    upstream react_app {
        server react:80;
    }

    upstream vite_app {
        server vite:80;   # Dashboard container runs NGINX → port 80
    }

    upstream api_app {
        server api:8000;  # Update if your API exposes a different port
    }

    # ===============================
    # HTTPS Server
    # ===============================
    server {
        listen 443 ssl;
        server_name 192.168.100.92;

        ssl_certificate     /nginx/certs/selfsigned.crt;
        ssl_certificate_key /nginx/certs/selfsigned.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # React Frontend
        location / {
            proxy_pass http://react_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Dashboard (Vite Build)
        location /dashboard/ {
            proxy_pass http://vite_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API Backend
        location /api/ {
            proxy_pass http://api_app/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ===============================
    # Redirect HTTP → HTTPS
    # ===============================
    server {
        listen 80;
        server_name 192.168.100.92;
        return 301 https://$host$request_uri;
    }
}
