version: "3.9"

services:
  cebba-web:
    image: michaelmurwayi/cebba-website:v1.1

    networks:
      - CEBBA

    deploy:
      replicas: 1

      placement:
        constraints:
          - node.role == manager

      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3

      update_config:
        parallelism: 1
        delay: 10s
        order: start-first

      rollback_config:
        parallelism: 1
        delay: 5s

      resources:
        limits:
          cpus: "0.50"
          memory: 512M

        reservations:
          cpus: "0.10"
          memory: 128M

      labels:
        - "traefik.enable=true"

        # HTTP
        - "traefik.http.routers.cebba.rule=Host(`cebba.ke`,`www.cebba.ke`)"
        - "traefik.http.routers.cebba.entrypoints=web"

        # HTTPS
        - "traefik.http.routers.cebba-secure.rule=Host(`cebba.ke`,`www.cebba.ke`)"
        - "traefik.http.routers.cebba-secure.entrypoints=websecure"
        - "traefik.http.routers.cebba-secure.tls.certresolver=letsencrypt"

        # Redirect HTTP → HTTPS
        - "traefik.http.middlewares.redirect.redirectscheme.scheme=https"
        - "traefik.http.routers.cebba.middlewares=redirect"

        # Service Port
        - "traefik.http.services.cebba.loadbalancer.server.port=80"

networks:
  CEBBA:
    external: true