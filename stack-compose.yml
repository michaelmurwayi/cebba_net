version: "3.9"

services:
  cebba-web:
    image: michaelmurwayi/cebba-website:v1.0

    networks:
      - CEBBA

    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: ingress

    deploy:
      replicas: 1

      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3

      update_config:
        parallelism: 1
        delay: 10s
        order: start-first

      rollback_config:
        parallelism: 1
        delay: 5s

      resources:
        limits:
          cpus: "0.50"
          memory: 512M

        reservations:
          cpus: "0.10"
          memory: 128M

      placement:
        constraints:
          - node.role==manager

networks:
  CEBBA:
    external: true
